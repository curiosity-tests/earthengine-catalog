# Continuous Integration (CI)

name: CI
run-name: "CI ${{ inputs.leg || github.event_name }} ${{ inputs.racecar_run }}"
on:
  push:
  pull_request:

  workflow_dispatch:
    inputs:
      leg:
        description: "baseline (uninstrumented) or instrumented (under chalk/curiosity)"
        type: choice
        options: [instrumented, baseline]
        default: baseline
      profile:
        description: "CrashOverride chalk profile"
        type: string
        default: curiosity-tests-racecar
      racecar_run:
        description: "racecar correlation token, echoed into the run name"
        type: string
        default: ""

env:
  CHALK_ON: ${{ inputs.leg == 'instrumented' }}
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python 3.10
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          pip install absl-py
      - name: Debug Python environment
        run: |
          pip list
          echo $PYTHONPATH
          python -c "import sys; print(sys.path)"          
      - name: Cache bazel
        uses: actions/cache@v5
        env:
          cache-name: bazel-cache
        with:
          path: |
            ~/.cache/bazelisk
            ~/.cache/bazel
          key: ${{ runner.os }}-${{ env.cache-name }}-${{ github.ref }}
          restore-keys: ${{ runner.os }}-${{ env.cache-name }}-development
      - uses: actions/checkout@v6
      - name: Build
        run: bazel build  --define jsonnet_port=cpp //...
      - name: Test Checker
        run: bazel test  --define jsonnet_port=cpp --test_output=errors //...
      - name: Checker
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # Required for GitHub API
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}      # Required for gh CLI
        run: bazel-bin/checker/ee_stac_check
